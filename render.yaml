# Render Blueprint: describes the whole production setup (database, API, site).
# Create it from the Render dashboard: New > Blueprint, then pick this repository.
# Every variable marked `sync: false` is asked for at creation time and is never stored in git.
# Step by step (accounts to open, DNS, Stripe, first admin): docs/deploiement.md

databases:
  - name: maison-guillard-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "16"
    databaseName: maison_guillard
    user: maison

services:
  # ---------------------------------------------------------------- API (FastAPI)
  - type: web
    name: maison-guillard-api
    runtime: python
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations first, then the server: a deploy with a broken migration never starts.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production        # the API refuses to start if a setting below is missing or unsafe
      - key: TRUST_PROXY
        value: "1"               # Render's proxy adds the visitor's address: needed by the rate limiter
      - key: DATABASE_URL
        fromDatabase:
          name: maison-guillard-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true      # long random value created by Render, never reused from development
      # Public address of the site, with https (links in e-mails, return from Stripe)
      - key: SITE_URL
        sync: false              # e.g. https://www.maisonguillard.fr
      # Origin(s) allowed to call the API from the browser: the site's address
      - key: CORS_ORIGINS
        sync: false              # e.g. https://www.maisonguillard.fr
      # Stripe: LIVE secret key of the artisane's account, and the secret of the webhook endpoint
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Cloudinary: product photos and finish images (the disk of the API is erased at each deploy)
      - key: CLOUDINARY_URL
        sync: false              # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
      # Brevo SMTP: e-mails to customers and to the artisane
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_EXPEDITEUR
        sync: false              # e.g. Maison Guillard <contact@maisonguillard.fr> (address verified in Brevo)
      - key: EMAIL_ARTISAN
        sync: false              # where new requests, payments and messages are notified

  # ---------------------------------------------------------------- Site (React, static)
  - type: web
    name: maison-guillard-site
    runtime: static
    branch: main
    autoDeploy: true
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_URL
        sync: false              # address of the API with /api, e.g. https://api.maisonguillard.fr/api
    routes:
      # Single-page application: every address serves index.html, React then shows the right page.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
